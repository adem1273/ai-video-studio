name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/actions@v3
        with:
          run: install
      
      - name: Type Check
        run: npx tsc --noEmit -p tsconfig.app.json
      
      - name: Build
        run: npm run build
      
      - name: Test
        run: npx vitest run --coverage
